# nginx proxy address - http://172.17.0.1:8105

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  snapdrop:
    image: snapdrop/snapdrop:latest
    container_name: snapdrop-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - snapdrop
    ports:
      - "8105:8105"
    environment:
      TZ: ${TZ:-America/New_York}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    volumes:
      - ./volumes/config/snapdrop:/config
      - ./volumes/data/snapdrop:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  snapdrop:
    external: false
